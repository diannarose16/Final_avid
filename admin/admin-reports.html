<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f4f6f9;
        }

        /* admin-navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 15px 20px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .navbar h1 {
            font-size: 1.5rem;
            color: #264653;
        }

                
        .admin-navbar {
            width: 250px;
            background-color: #2a9d8f;
            color: #fff;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .admin-navbar h2 {
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .admin-navbar a {
            text-decoration: none;
            color: #fff;
            width: 100%;
            text-align: left;
            padding: 15px 30px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .admin-navbar a:hover {
            background-color: #264653;
        }

        /* Active link styling */
        .admin-navbar a.active {
            background-color: #1b645c;
            font-weight: bold;
        }

        .admin-navbar a i {
            margin-right: 10px;
        }
        /* Main Dashboard Content */
        .reports-content {
            flex: 1;
            padding: 30px;
        }
        /***** Analytics Start *****/
        .analytics-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .analytics-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .analytics-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        }

        .analytics-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #264653;
        }

        .analytics-card p {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Admin Header and Navbar Copy Paste lang to halin sa internet my nigga -->
    <div class="admin-navbar">
        <h2>Dashboard</h2>
        <a href="#" class="active"><i class="fas fa-chart-line"></i> Reports</a>
        <a href="#"><i class="fas fa-envelope"></i> Messages</a>
        <a href="#"><i class="fas fa-plus"></i> Listings</a>
        <a href="#"><i class="fas fa-box"></i> Orders</a>
        <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <!-- Main Content -->
    <div class="reports-content">
        <div class="navbar">
            <h1>Avid Reports</h1>
        </div>
        <div class="analytics-cards">
            <div class="analytics-card">
                <h3>Line Graph</h3>
                <p>Placeholder for line graph.</p>
            </div>
            <div class="analytics-card">
                <h3>Monthly Sales</h3>
                <p>Placeholder for monthly sales data.</p>
            </div>
            <div class="analytics-card">
                <h3>New Accounts</h3>
                <p>Placeholder for new account stats.</p>
            </div>
        </div>
    </div>
</body>
</html>
